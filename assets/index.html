<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050608">
<title>Insight: Amygdala AR</title>
<style>
  :root { --fg:#e9ecef; --muted:#a9b0b7; --panel:rgba(4,7,10,.66); --line:rgba(255,255,255,.15); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:#030405; color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #app { position:relative; width:100vw; height:100dvh; background:#030405; overflow:hidden; }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(1); background:#050608; }
  #world,#fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #world { z-index:3; }
  #fx { z-index:4; mix-blend-mode:screen; opacity:.55; }
  .vignette { position:absolute; inset:0; z-index:5; pointer-events:none; background:radial-gradient(circle at center, transparent 42%, rgba(0,0,0,.42) 72%, rgba(0,0,0,.86) 100%); }
  .grain { position:absolute; inset:-20%; z-index:6; pointer-events:none; opacity:.13; background-image:radial-gradient(circle at 20% 30%, #fff 0 1px, transparent 1px),radial-gradient(circle at 70% 60%, #fff 0 1px, transparent 1px); background-size:11px 13px,17px 19px; animation:grain .18s steps(2) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(3%,-2%)} 50%{transform:translate(-2%,3%)} 75%{transform:translate(2%,2%)} 100%{transform:translate(0,0)} }
  #hud { position:absolute; z-index:10; inset:0; pointer-events:none; padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; justify-content:space-between; }
  .top,.bottom { display:flex; gap:10px; align-items:flex-start; justify-content:space-between; }
  .panel { pointer-events:auto; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(8px); border-radius:14px; padding:10px 12px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .title { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#d8dde2; }
  .tiny { font-size:11px; color:var(--muted); margin-top:3px; }
  .meter { width:min(44vw,220px); }
  .bar { height:6px; background:rgba(255,255,255,.1); border-radius:999px; overflow:hidden; margin-top:7px; }
  .fill { height:100%; width:48%; background:linear-gradient(90deg,#83929e,#e8edf1); transition:width .2s; }
  button { appearance:none; border:1px solid rgba(255,255,255,.18); background:rgba(10,14,18,.76); color:#fff; min-height:44px; padding:9px 13px; border-radius:12px; font-weight:700; font-size:14px; }
  button:active { transform:scale(.98); }
  #start { font-size:16px; padding:12px 18px; }
  #centerCard { position:absolute; z-index:20; inset:0; display:grid; place-items:center; padding:24px; background:linear-gradient(rgba(2,3,5,.68),rgba(2,3,5,.88)); }
  #centerCard .box { width:min(92vw,480px); text-align:center; background:rgba(5,8,11,.88); border:1px solid rgba(255,255,255,.16); border-radius:18px; padding:20px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:#b7bec5; line-height:1.45; font-size:14px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
  #crosshair { position:absolute; z-index:8; left:50%; top:50%; width:42px; height:42px; transform:translate(-50%,-50%); pointer-events:none; opacity:.75; }
  #crosshair:before,#crosshair:after { content:""; position:absolute; background:rgba(255,255,255,.75); }
  #crosshair:before { width:1px; height:42px; left:20px; top:0; }
  #crosshair:after { height:1px; width:42px; left:0; top:20px; }
  #message { position:absolute; z-index:12; left:50%; top:66%; transform:translateX(-50%); width:min(88vw,520px); text-align:center; font-size:13px; letter-spacing:.04em; text-shadow:0 2px 8px #000; pointer-events:none; min-height:20px; }
  #flash { position:absolute; inset:0; z-index:15; background:#dfe8ec; opacity:0; pointer-events:none; }
  .hint { max-width:260px; }
  input[type=range] { width:100%; accent-color:#dfe6eb; }
  #insightNum { font-variant-numeric:tabular-nums; font-weight:800; }
</style>
</head>
<body>
<div id="app">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="world"></canvas>
  <canvas id="fx"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div id="crosshair"></div>
  <div id="message"></div>
  <div id="flash"></div>
  <div id="hud">
    <div class="top">
      <div class="panel meter">
        <div class="title">INSIGHT <span id="insightNum">48</span></div>
        <input id="insight" type="range" min="0" max="99" value="48" aria-label="Insight">
        <div class="bar"><div id="insightFill" class="fill"></div></div>
        <div class="tiny">Più Insight = più cose diventano visibili.</div>
      </div>
      <div class="panel">
        <div class="title">PRESENZE</div>
        <div id="count" style="font-size:24px;font-weight:900;line-height:1.05">0</div>
        <div class="tiny">rilevate</div>
      </div>
    </div>
    <div class="bottom">
      <div class="panel hint">
        <div class="title">AZIONE</div>
        <div class="tiny">Muovi il telefono. Tocca vicino a una creatura per agganciarla.</div>
      </div>
      <div style="display:flex;gap:8px;pointer-events:auto">
        <button id="spawn" type="button">+ presenza</button>
        <button id="flip" type="button">↔ camera</button>
      </div>
    </div>
  </div>
  <div id="centerCard">
    <div class="box">
      <div class="title">FAN MINI-AR / COSMIC HORROR</div>
      <h1>INSIGHT: Amygdala AR</h1>
      <p>Avvio fotocamera e sensori… Guarda in alto e muovi lentamente il telefono.</p>
      <button id="start" type="button">RIPROVA FOTOCAMERA</button>
    </div>
  </div>
</div>
<script>
(() => {
  const app=document.getElementById('app'),video=document.getElementById('cam'),world=document.getElementById('world'),fx=document.getElementById('fx');
  const wctx=world.getContext('2d'),fctx=fx.getContext('2d'),startBtn=document.getElementById('start'),card=document.getElementById('centerCard');
  const insight=document.getElementById('insight'),insightNum=document.getElementById('insightNum'),insightFill=document.getElementById('insightFill'),count=document.getElementById('count');
  const spawnBtn=document.getElementById('spawn'),flipBtn=document.getElementById('flip'),msg=document.getElementById('message'),flash=document.getElementById('flash');
  let stream=null,facingMode='environment',running=false,raf=0,last=performance.now(),orient={beta:0,gamma:0,alpha:0},smoothed={x:0,y:0},messageTimer=0;
  const creatures=[]; const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function resize(){ const dpr=Math.min(devicePixelRatio||1,2),r=app.getBoundingClientRect(); for(const c of [world,fx]){ c.width=Math.max(1,Math.floor(r.width*dpr)); c.height=Math.max(1,Math.floor(r.height*dpr)); c.style.width=r.width+'px'; c.style.height=r.height+'px'; c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);} }
  function ping(t){msg.textContent=t;clearTimeout(messageTimer);messageTimer=setTimeout(()=>msg.textContent='',1800)}
  function newCreature(forceVisible=false){ creatures.push({x:rnd(.10,.90),y:rnd(.08,.70),depth:rnd(.65,1.5),scale:rnd(.7,1.35),phase:rnd(0,Math.PI*2),arms:Math.floor(rnd(8,14)),eyes:Math.floor(rnd(6,15)),threshold:forceVisible?0:Math.floor(rnd(18,72)),locked:false,drift:rnd(-.012,.012)}); if(creatures.length>12)creatures.shift(); ping('Qualcosa si è mosso sopra di te.'); }
  function seed(){creatures.length=0;for(let i=0;i<8;i++)newCreature(i<2)}
  function drawCreature(ctx,c,px,py,s,t,visibility){
    ctx.save();ctx.translate(px,py);ctx.scale(s,s);const pulse=1+Math.sin(t*1.8+c.phase)*.035;ctx.scale(pulse,pulse);ctx.globalAlpha=visibility;
    let grad=ctx.createRadialGradient(0,0,8,0,0,120);grad.addColorStop(0,'rgba(220,230,230,.18)');grad.addColorStop(.35,'rgba(60,68,72,.16)');grad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,120,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(18,20,22,.97)';ctx.fillStyle='rgba(10,11,13,.93)';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';
    for(let i=0;i<c.arms;i++){const a=(i/c.arms)*Math.PI*2+Math.sin(t*.7+c.phase+i)*.09,len=55+(i%3)*16+Math.sin(t*1.3+i)*7,ex=Math.cos(a)*len,ey=Math.sin(a)*len*.72,bend=Math.sin(a*3+c.phase)*18;ctx.beginPath();ctx.moveTo(Math.cos(a)*18,Math.sin(a)*13);ctx.quadraticCurveTo(ex*.55+Math.cos(a+Math.PI/2)*bend,ey*.55+Math.sin(a+Math.PI/2)*bend,ex,ey);ctx.stroke();ctx.beginPath();ctx.arc(ex,ey,5,0,Math.PI*2);ctx.fill();}
    ctx.beginPath();ctx.ellipse(0,0,30,43,Math.sin(c.phase)*.15,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-20,-24);ctx.quadraticCurveTo(-15,-68+Math.sin(t+c.phase)*4,-4,-90);ctx.quadraticCurveTo(9,-66,22,-22);ctx.closePath();ctx.fill();ctx.stroke();
    for(let i=0;i<4;i++){const side=i<2?-1:1,yy=18+(i%2)*10;ctx.beginPath();ctx.moveTo(side*15,yy);ctx.quadraticCurveTo(side*(34+i*4),48,side*(47+i*7),72);ctx.stroke();}
    ctx.fillStyle='rgba(226,232,225,.90)';for(let i=0;i<c.eyes;i++){const aa=(i/c.eyes)*Math.PI*2,rr=12+(i%3)*5,ex=Math.cos(aa)*rr*.9,ey=Math.sin(aa)*rr*.65-5,blink=Math.max(.25,Math.abs(Math.sin(t*2.3+c.phase+i)));ctx.save();ctx.translate(ex,ey);ctx.scale(1,blink);ctx.beginPath();ctx.ellipse(0,0,2.2,4.3,aa,0,Math.PI*2);ctx.fill();ctx.restore();}
    if(c.locked){ctx.strokeStyle='rgba(235,240,240,.9)';ctx.lineWidth=1.6;ctx.setLineDash([7,6]);ctx.beginPath();ctx.arc(0,0,62+Math.sin(t*4)*4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}ctx.restore();
  }
  function drawFX(width,height,t,ins){fctx.clearRect(0,0,width,height);const amount=clamp((ins-35)/64,0,1);if(amount<=0)return;fctx.globalAlpha=.11*amount;fctx.strokeStyle='rgba(230,235,238,.7)';for(let i=0;i<8;i++){const y=(i/8)*height+Math.sin(t*2+i)*5;fctx.beginPath();fctx.moveTo(0,y);for(let x=0;x<=width;x+=24)fctx.lineTo(x,y+Math.sin(x*.025+t*3+i)*rnd(1,5)*amount);fctx.stroke();}fctx.globalAlpha=1}
  function frame(now){if(!running)return;const dt=Math.min(.05,(now-last)/1000);last=now;const r=app.getBoundingClientRect(),width=r.width,height=r.height;wctx.clearRect(0,0,width,height);const targetX=clamp(orient.gamma/45,-1,1),targetY=clamp((orient.beta-45)/55,-1,1);smoothed.x+=(targetX-smoothed.x)*.055;smoothed.y+=(targetY-smoothed.y)*.055;const ins=Number(insight.value),t=now/1000;let visible=0;for(const c of creatures){c.x+=c.drift*dt;if(c.x<.07||c.x>.93)c.drift*=-1;const visibility=clamp((ins-c.threshold+13)/18,0,1);if(visibility>.08)visible++;if(visibility<=.01)continue;const px=c.x*width-smoothed.x*120*c.depth+Math.sin(t*.3+c.phase)*10,py=c.y*height-smoothed.y*75*c.depth+Math.sin(t*.9+c.phase)*7,s=c.scale*(Math.min(width,height)/430)*(1+visibility*.08);drawCreature(wctx,c,px,py,s,t,visibility*.95);c._screen={x:px,y:py,r:70*s};}count.textContent=visible;drawFX(width,height,t,ins);raf=requestAnimationFrame(frame)}
  async function requestOrientation(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){await DeviceOrientationEvent.requestPermission()}}catch(e){}}
  async function startCamera(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Object.assign(new Error('GET_USER_MEDIA_UNAVAILABLE'),{name:'MediaDevicesUnavailable'});await requestOrientation();if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facingMode},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();card.style.display='none';running=true;last=performance.now();seed();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);ping('Alza lo sguardo. Non tutto è visibile con poco Insight.')}catch(err){document.querySelector('#centerCard p').textContent='Fotocamera non disponibile: '+((err&&err.name)||'permesso negato');card.style.display='grid'}}
  startBtn.addEventListener('click',startCamera); insight.addEventListener('input',()=>{const v=Number(insight.value);insightNum.textContent=v;insightFill.style.width=v+'%';if(v>75&&Math.random()<.12)ping('Non guardarle troppo a lungo.')}); spawnBtn.addEventListener('click',()=>newCreature(true)); flipBtn.addEventListener('click',async()=>{facingMode=facingMode==='environment'?'user':'environment';await startCamera()});
  window.addEventListener('deviceorientation',e=>{orient.beta=e.beta||0;orient.gamma=e.gamma||0;orient.alpha=e.alpha||0},true);
  app.addEventListener('pointerdown',e=>{if(!running)return;let best=null,bestD=Infinity;for(const c of creatures){if(!c._screen)continue;const d=Math.hypot(e.clientX-c._screen.x,e.clientY-c._screen.y);if(d<bestD){bestD=d;best=c}}if(best&&bestD<Math.max(95,best._screen.r*1.2)){best.locked=!best.locked;flash.animate([{opacity:0},{opacity:.28},{opacity:0}],{duration:180});ping(best.locked?'PRESENZA AGGANCIATA':'Aggancio perso.')}else ping('Solo rumore.')});
  window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else if(running){last=performance.now();raf=requestAnimationFrame(frame)}});
  resize();insight.dispatchEvent(new Event('input'));setTimeout(startCamera,220);
})();
</script>
</body>
</html>
